# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - LibraryDatabaseServer

on:
  push:
    branches:
      - colin_branch
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2CF92D95BF3F4491BF6E568347F82CB3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4251F8D392CB4647AE5D95CAEB05FF61 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B180705BCA87407D9CF31864BF3B2E5F }}

      - name: Deploy backend
        uses: azure/webapps-deploy@v3
        with:
          app-name: "LibraryDatabaseServer"
          slot-name: "Production"
          package: ./server
